<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">OBCS radial and lateral clearance profile</title>
  <desc id="desc">Wheel axle at the origin; radial distance rises vertically and lateral distance extends horizontally from the centre plane.</desc>
  <rect width="640" height="420" fill="white"/>
  <path d="M320 360V60M80 240H560" stroke="#333" stroke-width="2"/>
  <path d="M300 340 Q250 250 260 155 Q265 105 295 75" fill="none" stroke="#187a45" stroke-width="5"/>
  <path d="M340 340 Q390 250 380 155 Q375 105 345 75" fill="none" stroke="#187a45" stroke-width="5"/>
  <path d="M320 340 Q260 260 265 165 Q270 105 320 88 Q370 105 375 165 Q380 260 320 340Z" fill="#7bb6e8" fill-opacity=".35" stroke="#2878b5" stroke-width="3"/>
  <circle cx="320" cy="340" r="6" fill="#222"/>
  <text x="330" y="346" font-family="sans-serif" font-size="16">axle (origin)</text>
  <text x="327" y="78" font-family="sans-serif" font-size="16">r (radial)</text>
  <text x="480" y="230" font-family="sans-serif" font-size="16">z →</text>
  <text x="145" y="115" font-family="sans-serif" font-size="15" fill="#187a45">z_free_left(r)</text>
  <text x="395" y="115" font-family="sans-serif" font-size="15" fill="#187a45">z_free_right(r)</text>
  <text x="292" y="210" font-family="sans-serif" font-size="15" fill="#14517c">reference tyre</text>
  <text x="305" y="265" font-family="sans-serif" font-size="14">z = 0</text>
</svg>
