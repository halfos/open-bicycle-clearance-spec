[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-bicycle-clearance-spec"
version = "0.1.0"
description = "Reference implementation of the Open Bicycle Clearance Specification"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = [
  "pydantic>=2.11.7",
  "numpy>=2.3.2",
  "PyYAML>=6.0.2",
  "jsonschema>=4.25.0",
  "typer>=0.16.0",
  "matplotlib>=3.10.5",
]

[project.scripts]
obcs = "bikeclearance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeclearance"]

[tool.hatch.build.targets.wheel.force-include]
"schema/obcs.schema.json" = "bikeclearance/obcs.schema.json"

[dependency-groups]
dev = ["pytest>=8.4.1", "ruff>=0.12.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
